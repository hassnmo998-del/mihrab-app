name: 🌐 Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch Latest Release Binaries for Direct CDN Hosting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p website/downloads
          gh release download --repo "${{ github.repository }}" --pattern "*.apk" --pattern "*.exe" --dir website/downloads
          for f in website/downloads/*.apk; do
            [ -f "$f" ] && cp "$f" website/downloads/mihrab-android.apk
          done
          for f in website/downloads/*.exe; do
            [ -f "$f" ] && cp "$f" website/downloads/mihrab-windows.exe
          done
          ls -lh website/downloads/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
