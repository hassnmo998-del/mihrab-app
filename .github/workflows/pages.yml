name: 🌐 Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["🚀 Build & Release Mihrab App"]
    types:
      - completed
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fetch Latest Release Binaries for Direct CDN Hosting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p temp_downloads
          gh release download --repo "${{ github.repository }}" --pattern "*.apk" --pattern "*.exe" --dir temp_downloads --clobber
          mkdir -p website/downloads
          for f in temp_downloads/*.apk; do
            [ -f "$f" ] && cp "$f" website/downloads/mihrab-android.apk
          done
          for f in temp_downloads/*.exe; do
            [ -f "$f" ] && cp "$f" website/downloads/mihrab-windows.exe
          done
          rm -rf temp_downloads
          ls -lh website/downloads/

      # نسخة الآيفون (web.yml يرفقها بالإصدار). بعد إصدار جديد قد يسبق النشرُ بناءَها
      # ببضع دقائق، فنأخذ أحدث إصدار يحملها ويعيد web.yml النشر حين ينتهي.
      - name: Fetch the iPhone (web) app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          web_tag=""
          for t in $(gh release list --repo "$repo" --limit 30 --exclude-drafts --json tagName -q '.[].tagName'); do
            if gh release view "$t" --repo "$repo" --json assets -q '.assets[].name' | grep -qx 'mihrab-web.zip'; then
              web_tag="$t"; break
            fi
          done
          if [ -n "$web_tag" ]; then
            gh release download "$web_tag" --repo "$repo" --pattern mihrab-web.zip --dir temp_web --clobber
            mkdir -p website/app
            unzip -q temp_web/mihrab-web.zip -d website/app
            rm -rf temp_web
            echo "📱 website/app ← $web_tag"
          else
            echo "::warning::No release carries mihrab-web.zip yet; deploying without /app/"
          fi

      # رقم آخر إصدار وعدد التحميلات لحظة النشر: تعرضهما الصفحة فوراً دون انتظار GitHub API
      - name: Write site data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" > temp_releases.json
          node .github/scripts/site-data.js temp_releases.json > website/site-data.json
          rm temp_releases.json
          cat website/site-data.json

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
