publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: 2.12.0
  qr_flutter: 4.1.0
  shared_preferences: 2.5.3
  google_fonts: 6.3.3
  intl: 0.20.2
  geolocator: 13.0.4
  share_plus: 10.1.4
  mobile_scanner: 5.2.3
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  equatable: ^2.1.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  record: ^6.2.1
  path_provider: ^2.1.6
  http: ^1.6.0
  audioplayers: ^6.7.1
  flutter_foreground_task: ^6.3.0
  url_launcher: ^6.3.2
  flutter_compass: ^0.8.1
  file_picker: ^11.0.3
  open_filex: ^4.7.0
  window_manager: ^0.4.3
  json_annotation: ^4.8.0
  dio: ^5.3.1
  package_info_plus: ^8.0.0
  audio_service: ^0.18.19
  permission_handler: 11.3.1
  adhan: ^2.0.0+1

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
