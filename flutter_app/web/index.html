<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- يُستبدل بقيمة --base-href عند البناء (على الموقع: /mihrab-app/app/) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="منصة محراب الذكية لإدارة حلقات تحفيظ القرآن والفعاليات المجتمعية">
  <meta name="theme-color" content="#FAF6F0">
  <!-- الصفحة العامة هي الموقع؛ هذه صفحة التطبيق نفسه -->
  <meta name="robots" content="noindex">

  <!-- الآيفون: يفتح من الشاشة الرئيسية كتطبيق بلا شريط متصفح -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="محراب">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>محراب</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: 'Tajawal';
      src: url('assets/assets/fonts/Tajawal-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Tajawal';
      src: url('assets/assets/fonts/Tajawal-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    :root {
      --bg: #FAF6F0;
      --card: #FFFFFF;
      --line: #EAE2D7;
      --ink: #2C1420;
      --muted: #7A6A60;
      --primary: #C86D3B;
      --primary-soft: #F6E6DA;
      --gold: #C5A059;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font-family: 'Tajawal', -apple-system, 'SF Arabic', 'Segoe UI', sans-serif; color: var(--ink); }

    /* شاشة البدء: تبقى حتى يرسم التطبيق أول إطار */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); transition: opacity .35s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(44, 20, 32, .12); }
    #splash .name { font-size: 26px; font-weight: 700; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: var(--primary);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(160%); } to { transform: translateX(-260%); } }
    #splash .slow { max-width: 260px; text-align: center; font-size: 14px; line-height: 1.7; color: var(--muted); opacity: 0; transition: opacity .4s; }
    #splash .slow.show { opacity: 1; }

    /* دليل الإضافة إلى الشاشة الرئيسية (Safari على الآيفون فقط) */
    #guide {
      position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto;
      background: var(--bg);
      padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 120px);
      box-sizing: border-box;
    }
    #guide.show { display: block; }
    #guide .head { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
    #guide .head img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 8px 24px rgba(44, 20, 32, .12); }
    #guide h1 { margin: 0; font-size: 22px; font-weight: 700; }
    #guide .steps { display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin: 0 auto; padding: 0; list-style: none; }
    #guide .step {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    }
    #guide .num {
      flex: none; width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 700; font-size: 15px;
      background: var(--primary); color: #fff;
    }
    #guide .text { flex: 1; font-size: 17px; font-weight: 700; line-height: 1.5; }
    #guide .text small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
    /* أيقونات تشبه أزرار Safari الحقيقية حتى يعرفها المستخدم بعينه */
    #guide .key {
      flex: none; min-width: 44px; height: 44px; padding: 0 8px; box-sizing: border-box; border-radius: 12px;
      display: grid; place-items: center; background: #F2F2F7; color: #007AFF;
    }
    #guide .key.word { font: 600 15px -apple-system, 'SF Arabic', sans-serif; }
    #guide .key svg { width: 26px; height: 26px; }
    #guide .later {
      display: block; margin: 22px auto 0; padding: 10px 16px; border: 0; background: none;
      font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline;
    }
    /* سهم يشير إلى شريط Safari أسفل الشاشة */
    #guide .arrow {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 10px); transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--primary); font-size: 14px; font-weight: 700;
      animation: bob 1.2s ease-in-out infinite;
    }
    #guide .arrow svg { width: 34px; height: 34px; }
    #guide.ipad .arrow { top: calc(env(safe-area-inset-top) + 8px); bottom: auto; flex-direction: column-reverse; }
    #guide.ipad .arrow svg { transform: rotate(180deg); }
    #guide.ipad { padding-top: calc(env(safe-area-inset-top) + 80px); padding-bottom: 40px; }
    @keyframes bob { 50% { transform: translate(-50%, 8px); } }
    #guide.ipad .arrow { animation-name: bob-up; }
    @keyframes bob-up { 50% { transform: translate(-50%, -8px); } }
    #guide .copy[hidden] { display: none; }
    #guide .copy {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 420px;
      margin: 16px auto 0; padding: 14px; border: 0; border-radius: 14px; box-sizing: border-box;
      background: var(--primary); color: #fff; font: inherit; font-size: 17px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/apple-touch-icon.png" alt="">
    <div class="name">مِحْرَاب</div>
    <div class="bar"></div>
    <div class="slow" id="slow">الفتح الأول يحتاج بعض الوقت حسب سرعة الإنترنت، وبعدها يفتح فوراً.</div>
  </div>

  <div id="guide" role="dialog" aria-labelledby="guide-title">
    <div class="head">
      <img src="icons/apple-touch-icon.png" alt="">
      <h1 id="guide-title">ثبّت محراب على شاشتك</h1>
    </div>
    <ol class="steps" id="steps"></ol>
    <button type="button" class="copy" id="copy" hidden>نسخ الرابط</button>
    <button type="button" class="later" id="later">استخدمه من المتصفح الآن</button>
    <div class="arrow" id="arrow" aria-hidden="true">
      <span id="arrow-label">من هنا</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIPad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isIOS = /iPhone|iPod/.test(ua) || isIPad;
      var standalone = navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      // متصفحات داخل التطبيقات (واتساب، تيليغرام…) ومتصفحات غير Safari لا تعطي «إضافة إلى الشاشة الرئيسية» بشكل موثوق
      var notSafari = /CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|Instagram|WhatsApp|Telegram|Line\/|Snapchat|MicroMessenger/.test(ua);
      var safariMajor = parseInt((ua.match(/Version\/(\d+)/) || [])[1] || '0', 10);

      var ICON = {
        more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
        share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
        add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
        safari: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>'
      };
      function step(n, key, title, hint, isWord) {
        return '<li class="step"><span class="num">' + n + '</span>' +
          '<span class="text">' + title + (hint ? '<small>' + hint + '</small>' : '') + '</span>' +
          '<span class="key' + (isWord ? ' word' : '') + '">' + key + '</span></li>';
      }

      function showGuide() {
        var guide = document.getElementById('guide');
        var html;
        if (notSafari) {
          html = step(1, ICON.safari, 'افتح هذا الرابط في Safari', 'انسخ الرابط بالزر تحت، ثم الصقه في Safari') +
                 step(2, ICON.add, 'ثم أضفه إلى الشاشة الرئيسية', 'ستظهر لك الخطوات هناك');
          document.getElementById('copy').hidden = false;
          document.getElementById('arrow').style.display = 'none';
        } else if (safariMajor >= 26) {
          // iOS 26 وما بعد: زر المشاركة صار داخل زر ••• بجانب شريط العنوان
          html = step(1, ICON.more, 'اضغط •••', isIPad ? 'أعلى الشاشة' : 'أسفل الشاشة، بجانب شريط العنوان') +
                 step(2, ICON.share, 'اضغط «مشاركة»') +
                 step(3, ICON.add, 'اختر «إضافة إلى الشاشة الرئيسية»', 'إن لم تظهر، اسحب القائمة للأعلى') +
                 step(4, 'إضافة', 'اضغط «إضافة»', 'ثم افتح محراب من أيقونته على الشاشة', true);
        } else {
          html = step(1, ICON.share, 'اضغط زر المشاركة', isIPad ? 'أعلى الشاشة' : 'أسفل الشاشة') +
                 step(2, ICON.add, 'اختر «إضافة إلى الشاشة الرئيسية»', 'إن لم تظهر، اسحب القائمة للأعلى') +
                 step(3, 'إضافة', 'اضغط «إضافة»', 'ثم افتح محراب من أيقونته على الشاشة', true);
        }
        document.getElementById('steps').innerHTML = html;
        if (isIPad) guide.classList.add('ipad');
        guide.classList.add('show');
        document.getElementById('splash').classList.add('gone');
      }

      document.getElementById('later').addEventListener('click', function () {
        document.getElementById('guide').classList.remove('show');
        document.getElementById('splash').classList.remove('gone');
        window.mihrabBoot && window.mihrabBoot();
      });
      document.getElementById('copy').addEventListener('click', function () {
        var btn = this, url = location.origin + location.pathname;
        var done = function () { btn.textContent = 'تم النسخ ✓'; };
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('', url); });
        else prompt('', url);
      });

      // Safari على الآيفون خارج الشاشة الرئيسية: نعلّم الإضافة أولاً ولا نحمّل التطبيق،
      // لأن التطبيق المضاف يبدأ بتخزين مستقل فكان التحميل هنا سيُعاد هناك.
      if (isIOS && !standalone) {
        window.mihrabHoldBoot = true;
        showGuide();
      }

      // رسالة تطمين إن طال الفتح الأول
      setTimeout(function () {
        var slow = document.getElementById('slow');
        if (slow) slow.classList.add('show');
      }, 8000);
      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('splash');
        s.classList.add('gone');
        setTimeout(function () { s.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
